[package]
name = "mosaic-lang"
version = "0.0.2"
edition = "2021"
authors = ["Lucas Plumb"]
keywords = ["compiler", "Mosaic"]
readme = "README.md"
rust-version = "1.80.0"
license-file = "LICENSE"
description = "A compiler for Mosaic."
categories = ["compilers"]
publish = true
repository = "https://github.com/ljp-projects/mosaic"

[[bin]]
name = "msc"
path = "src/main.rs"

[profile.dev]
incremental = true
panic = "unwind"

[profile.bench]
lto = "fat"
overflow-checks = false
opt-level = 3
incremental = true
debug-assertions = false
debug = "line-tables-only"

[profile.release]
lto = "fat"
overflow-checks = false
opt-level = "z"
incremental = true
debug-assertions = false
debug = "line-tables-only"
panic = "abort"
rpath = true
strip = true

[profile.release.package."*"]
overflow-checks = false
opt-level = "z"
incremental = true
debug-assertions = false
debug = "line-tables-only"

[profile.release.build-override]
overflow-checks = false
opt-level = "z"
incremental = true
debug-assertions = false
debug = "line-tables-only"


[dependencies]
cranelift-codegen = { version = "0.120.1" }
cranelift-module = { version = "0.120.1" }
cranelift-object = "0.120.1"
cranelift-frontend = { version = "0.120.1" }
colored = "3.0.0"
clap = { version = "4.5.54", features = ["derive"] }
either = "1.15.0"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros"] }
downcast-rs = "2.0"
target-lexicon = "0.13"
mmap-rs = "0.7"
homedir = "0.3"
