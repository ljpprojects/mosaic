[package]
name = "mosaic-lang"
version = "0.1.0"
edition = "2024"
authors = ["Lucas Plumb"]
keywords = ["compiler", "Mosaic"]
readme = "README.md"
rust-version = "1.97.0"
license-file = "LICENSE"
description = "A compiler for Mosaic."
categories = ["compilers"]
publish = true
repository = "https://github.com/ljp-projects/mosaic"

[workspace]
members = ["mosaic-frontend", "mosaic-shared"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "msc"
path = "src/main.rs"

[profile.dev]
incremental = true
panic = "unwind"

[profile.bench]
lto = "fat"
opt-level = 3
overflow-checks = false
incremental = false
debug-assertions = false
debug = "none"

[profile.release]
lto = "fat"
opt-level = 3
overflow-checks = false
incremental = false
debug-assertions = false
debug = "none"
panic = "abort"

[profile.release.package."*"]
opt-level = 3
overflow-checks = false
incremental = false
debug-assertions = false
debug = "none"

[profile.release.build-override]
opt-level = 3
overflow-checks = false
incremental = false
debug-assertions = false
debug = "none"

[dependencies]
cranelift-object = "0.130"
cranelift-codegen = { version = "0.130", features = ["all-native-arch"] }
cranelift-module = "0.130"
cranelift-frontend = "0.130"
cranelift-jit = "0.130"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
either = "1.15.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync"] }
downcast-rs = "2.0"
target-lexicon = "0.13"
mmap-rs = "0.7"
homedir = "0.3"
bigdecimal = "0.4"
rodio = "0.22"


# Why is rodio a dependency?
# Simple! Because the compiler serenades you with music on error cases, here's a
# handy-dandy list!
#
# One MSR-related error: Slowed + reverb GALLERY (Toby Fox)
#
# 30 of any errors: THE WORLD REVOLVING (Toby Fox)sped up and with a disgusting echo
# 200 errors: BIG SHOT (Toby Fox) slowed + reverb
# 500 errors: Hall of Eagans (Theodore Shapiro) slowed + reverb
# 1000 errors: idk little melody I made (if you've seen hotdog-clicker, you haven't, it is the HOPE motif)
#
# 1 use of stackalloc: KING OF ROLYPOLY (Toby Fox) slowed + reverb
# 2 uses of stackalloc: Ethereal Blade (Moonkit) slowed + reverb
# 10 uses of stackalloc: APRIL 2012 (Toby Fox) slowed + reverb
# 100 uses of stackalloc: Labor of Love (Theodore Shapiro) sped up + reverb
#
# And if you use all of the SIMD types in one source file sprinkled throughout
# various variable definitions, you get ALL OF THEM AT ONCE! Also your screen
# goes completely dark for the duration of the longest (they are played in parallel)
# and this is why framebuffer is needed
#
# ALSO sometimes when the compiler feels angry at you (maybe you have been
# recompiling too often, maybe you didn't change your source file/s before
# recompiling, etc.) then your screen might flash red. If you have the
# `--flash-me-baby` flag enabled, that is (it's off by default).
#
# Also if you specify `--lmnop` there is a 1 in 56667 chance for a GIF of Mr. Ant
# Tenna doing his funny little dance to appear (and repeat 32 times). Every `ol`
# you add on to `lmnop` increases this chance by 666 (and if you add an 'o' to
# the end by 7 but only once).
# For example, `--lmnopolololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololololo` means there is a 1 in 50 chance of the GIF to appear (oh and the KING OF ROLYPOLY track for one
# stackalloc reused).
#
# NEW IN MOSAIC97
#
# When you use all bases of float literals and integer literals a mysterious QR
# code will overtake your screen for like... 2 minutes? Around that long
#
# Also it may or may not spin up a webserver but that's none of your business
# (note to self: do I still have DaVinci Resolve installed?)
#
# Wait who am I kidding it will spin up a webserver that hosts a website to stream
# Mosaic97 (the .smol one not the uncompressed original)

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
block2 = "0.6.2"
objc2 = { version = "0.6.4", features = [ "objc2-proc-macros", "exception" ] }
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "lexer_tests"
harness = false

[[bench]]
name = "lexer_tests_1000"
harness = false

[features]
default = ["chaos"]
chaos = []
